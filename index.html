<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>定期存款記錄器</title>
    <style>
        :root { --hk-blue: #007aff; --hk-orange: #ff9500; --bg: #f2f2f7; --card-bg: #ffffff; --withdraw: #ff453a; --success: #34c759; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 0 0; }

        .top-panel { flex-shrink: 0; background: var(--bg); padding: 8px 12px 4px 12px; z-index: 10; }
        
        /* 總結大卡片 */
        .display-card { background: var(--hk-orange); color: white; padding: 12px 15px; border-radius: 18px; margin-bottom: 6px; box-shadow: 0 4px 10px rgba(255,149,0,0.2); }
        .card-title { font-size: 11px; opacity: 0.85; margin-bottom: 2px; }
        .amount { font-size: 28px; font-weight: bold; margin: 0; font-variant-numeric: tabular-nums; }
        .breakdown { font-size: 11px; opacity: 0.85; margin-top: 4px; font-variant-numeric: tabular-nums; }

        /* 定期列表區域 */
        .log-section { flex: 1; background: white; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid #e5e5ea; position: relative; margin-top: 6px; }
        #logList { overflow-y: auto; flex: 1; padding: 12px 15px 80px 15px; }
        
        /* 單張定期卡片設計 */
        .deposit-item { 
            background: #f9f9fb; border: 1px solid #e5e5ea; border-radius: 14px; 
            padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .deposit-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .bank-badge { background: #e5e5ea; color: #1c1c1e; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 600; display: inline-block; margin-bottom: 3px; }
        .deposit-dates { font-size: 10px; color: #8e8e93; }
        .deposit-title { font-size: 12px; font-weight: 600; color: #1c1c1e; }
        .deposit-duration { font-size: 10px; color: var(--hk-blue); font-weight: 500; margin-top: 2px; }
        
        .deposit-right { text-align: right; }
        .deposit-amt { font-size: 14px; font-weight: bold; color: #34c759; font-variant-numeric: tabular-nums; }
        .deposit-interest { font-size: 10px; color: #8e8e93; margin-top: 2px; }

        /* 進度條 */
        .progress-box { width: 100%; margin-top: 2px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 9px; color: #8e8e93; margin-bottom: 3px; font-weight: 600; }
        .progress-bar-bg { width: 100%; height: 6px; background: #e5e5ea; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--hk-blue); border-radius: 3px; transition: width 0.4s ease; }
        .progress-bar-fill.completed { background: var(--success); }

        .deposit-footer { display: flex; justify-content: flex-end; margin-top: 2px; }
        .delete-btn { background: none; border: none; color: #ff3b30; font-size: 11px; cursor: pointer; padding: 0; }

        /* 浮動新增按鈕 (+) */
        .fab-btn {
            position: fixed; bottom: 30px; right: 20px; 
            width: 54px; height: 54px; background: var(--hk-blue); color: white; 
            border-radius: 50%; border: none; font-size: 28px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0,122,255,0.4); cursor: pointer; z-index: 100;
            transition: transform 0.2s;
        }
        .fab-btn:active { transform: scale(0.92); }

        /* 彈出式新增視窗 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: white; width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #1c1c1e; }
        .close-modal { background: none; border: none; font-size: 18px; color: #8e8e93; cursor: pointer; }

        .input-row { display: flex; flex-direction: column; gap: 10px; }
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .fields-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; }
        .field-unit { min-width: 0; width: 100%; }
        
        label { display: block; font-size: 9px; color: #8e8e93; margin-bottom: 3px; font-weight: bold; white-space: nowrap; }
        
        input { 
            width: 100%; height: 40px; border: 1px solid #d1d1d6; border-radius: 10px; 
            font-size: 14px; background: #f9f9f9; text-align: center; margin: 0; padding: 0;
            -webkit-appearance: none; appearance: none;
        }

        .btn-submit { width: 100%; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 15px; height: 44px; cursor: pointer; background: var(--hk-blue); margin-top: 10px; }

        /* 底部控制列 */
        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); 
            padding: 8px 15px calc(10px + env(safe-area-inset-bottom)); 
            display: flex; justify-content: center; border-top: 0.5px solid #e5e5ea;
        }
        .btn-small-mng { background: none; border: 1px solid #e5e5ea; color: #ff3b30; font-size: 10px; padding: 4px 12px; border-radius: 10px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div id="syncStatus" style="font-size:9px; text-align:center; color:#8e8e93; margin-bottom:2px;">同步中...</div>

        <!-- 總覽卡片 -->
        <div class="display-card">
            <div class="card-title">定期總本金</div>
            <span class="amount" id="totalPrincipal">HK$ 0.00</span>
            <div class="breakdown" id="totalInterestDisplay">預估總利息: HK$ 0.00</div>
        </div>
    </div>

    <!-- 定期列表主頁 -->
    <div class="log-section">
        <div id="logList"></div>
        <div class="bottom-bar">
            <button class="btn-small-mng" onclick="handleReset()">🧹 清空所有定期紀錄</button>
        </div>
    </div>

    <!-- 浮動新增按鈕 (+) -->
    <button class="fab-btn" onclick="toggleModal(true)">+</button>

    <!-- 彈出式新增表單 Modal -->
    <div class="modal-overlay" id="addModal" onclick="checkClose(event)">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">➕ 新增定期存款</span>
                <button class="close-modal" onclick="toggleModal(false)">✕</button>
            </div>
            <div class="input-row">
                <div class="fields-grid-3">
                    <div class="field-unit"><label>🏦 銀行</label><input type="text" id="depBank" placeholder="匯豐"></div>
                    <div class="field-unit"><label>💰 本金</label><input type="number" id="depAmt" placeholder="0.00" inputmode="decimal"></div>
                    <div class="field-unit"><label>📈 年利率 %</label><input type="number" id="depRate" placeholder="0.00" inputmode="decimal"></div>
                </div>
                <div class="fields-grid">
                    <div class="field-unit"><label>📅 起息日</label><input type="date" id="startDate"></div>
                    <div class="field-unit"><label>📅 到期日</label><input type="date" id="endDate"></div>
                </div>
                <button class="btn-submit" onclick="addDeposit()">確認新增</button>
            </div>
        </div>
    </div>

<script>
    const SCRIPT_URL = '你的_GOOGLE_APPS_SCRIPT_URL_在這裡';
    let db = { deposits: [] };

    const getTodayStr = () => new Date().toLocaleDateString('sv-SE');
    const getFutureStr = () => {
        let d = new Date();
        d.setFullYear(d.getFullYear() + 1);
        return d.toLocaleDateString('sv-SE');
    };
    
    document.getElementById('startDate').value = getTodayStr();
    document.getElementById('endDate').value = getFutureStr();

    function fmt(num) { return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    // 開啟或關閉彈出視窗
    function toggleModal(show) {
        const modal = document.getElementById('addModal');
        if (show) {
            modal.classList.add('active');
        } else {
            modal.classList.remove('active');
        }
    }

    function checkClose(e) {
        if (e.target.id === 'addModal') toggleModal(false);
    }

    async function pull() {
        try {
            const r = await fetch(`${SCRIPT_URL}?action=read`);
            const data = await r.json();
            if (data) {
                if (Array.isArray(data)) db.deposits = data;
                else if (data.deposits) db = data;
            }
            renderDeposits();
            document.getElementById('syncStatus').innerText = "● 雲端同步完成";
        } catch (e) {
            document.getElementById('syncStatus').innerText = "× 同步失敗";
        }
    }

    async function push() {
        document.getElementById('syncStatus').innerText = "📤 儲存中...";
        await fetch(`${SCRIPT_URL}?action=write&data=${encodeURIComponent(JSON.stringify(db))}`, { mode: 'no-cors' });
        renderDeposits();
        setTimeout(pull, 1000);
    }

    function addDeposit() {
        let bank = document.getElementById('depBank').value.trim() || "預設銀行";
        let amt = parseFloat(document.getElementById('depAmt').value);
        let rate = parseFloat(document.getElementById('depRate').value);
        let start = document.getElementById('startDate').value;
        let end = document.getElementById('endDate').value;

        if (!amt || !rate || !start || !end) {
            return alert("請完整填寫銀行、本金、利率及起訖日期！");
        }
        if (new Date(start) >= new Date(end)) {
            return alert("到期日必須大於起息日！");
        }

        db.deposits.push({ id: Date.now(), bank, amt, rate, start, end });
        document.getElementById('depBank').value = '';
        document.getElementById('depAmt').value = '';
        document.getElementById('depRate').value = '';
        
        toggleModal(false); // 關閉彈窗
        push();
    }

    function deleteDeposit(id) {
        if (confirm("確定刪除這筆定期紀錄？")) {
            db.deposits = db.deposits.filter(x => x.id !== id);
            push();
        }
    }

    function handleReset() {
        if (confirm("確定清空所有定期存款紀錄？")) {
            db.deposits = [];
            push();
        }
    }

    function renderDeposits() {
        let totalPrin = 0;
        let totalInt = 0;
        let html = "";
        const now = new Date();
        now.setHours(0,0,0,0);

        db.deposits.forEach(item => {
            let sDate = new Date(item.start);
            let eDate = new Date(item.end);
            sDate.setHours(0,0,0,0);
            eDate.setHours(0,0,0,0);
            
            let totalDays = Math.max(1, Math.ceil(Math.abs(eDate - sDate) / (1000 * 60 * 60 * 24)));
            let diffMonths = (eDate.getFullYear() - sDate.getFullYear()) * 12 + (eDate.getMonth() - sDate.getMonth());
            let totalMonths = Math.max(1, (diffMonths + (eDate.getDate() - sDate.getDate()) / 30)).toFixed(1);

            let interest = (item.amt * (item.rate / 100) * totalDays) / 365;

            let passedDays = Math.ceil((now - sDate) / (1000 * 60 * 60 * 24));
            let pct = 0;
            if (passedDays <= 0) pct = 0;
            else if (now >= eDate) pct = 100;
            else pct = Math.min(100, Math.max(0, Math.round((passedDays / totalDays) * 100)));

            const isDone = pct >= 100;
            const bankName = item.bank || "預設銀行";

            totalPrin += item.amt;
            totalInt += interest;

            html += `
                <div class="deposit-item">
                    <div class="deposit-header">
                        <div>
                            <span class="bank-badge">🏦 ${bankName}</span>
                            <div class="deposit-dates">${item.start} ~ ${item.end}</div>
                            <div class="deposit-title">年利率: ${item.rate}%</div>
                            <div class="deposit-duration">⏱️ 約存 ${totalDays} 天 (約 ${totalMonths} 個月)</div>
                        </div>
                        <div class="deposit-right">
                            <div class="deposit-amt">HK$ ${fmt(item.amt)}</div>
                            <div class="deposit-interest">預估利息: +${fmt(interest)}</div>
                        </div>
                    </div>

                    <div class="progress-box">
                        <div class="progress-info">
                            <span>${isDone ? '🎉 已到期' : '⏳ 存款進度'}</span>
                            <span>${pct}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${isDone ? 'completed' : ''}" style="width: ${pct}%;"></div>
                        </div>
                    </div>

                    <div class="deposit-footer">
                        <button class="delete-btn" onclick="deleteDeposit(${item.id})">刪除</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('totalPrincipal').innerText = `HK$ ${fmt(totalPrin)}`;
        document.getElementById('totalInterestDisplay').innerText = `預估總利息: HK$ ${fmt(totalInt)}`;
        document.getElementById('logList').innerHTML = html || '<div style="padding:40px; text-align:center; color:#ccc;">尚無定期存款紀錄，點擊右下角 + 新增</div>';
    }

    pull();
</script>
</body>
</html>
