<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>定期存款記錄器</title>
    <style>
        :root { --hk-blue: #007aff; --hk-orange: #ff9500; --bg: #f2f2f7; --card-bg: #ffffff; --withdraw: #ff453a; --success: #34c759; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 0 0; }

        .top-panel { flex-shrink: 0; background: var(--bg); padding: 8px 12px 6px 12px; z-index: 10; }
        
        /* 總結大卡片 (字體加大) */
        .display-card { background: var(--hk-orange); color: white; padding: 16px; border-radius: 18px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(255,149,0,0.2); }
        .card-title { font-size: 13px; opacity: 0.9; margin-bottom: 4px; font-weight: bold; }
        .amount { font-size: 34px; font-weight: bold; margin: 0; font-variant-numeric: tabular-nums; }
        .breakdown { font-size: 13px; opacity: 0.9; margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 500; }

        /* 分頁切換列 */
        .tabs-header { display: flex; background: #e5e5ea; border-radius: 10px; padding: 3px; margin-bottom: 6px; }
        .tab-btn { flex: 1; border: none; background: none; font-size: 13px; padding: 8px 0; border-radius: 8px; color: #3a3a3c; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: white; color: var(--hk-blue); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        /* 頁面切換容器 */
        .view-container { flex: 1; background: white; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid #e5e5ea; position: relative; }
        .view { display: flex; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: white; transition: transform 0.3s ease; }
        .view.hidden-left { transform: translateX(-100%); }
        .view.hidden-right { transform: translateX(100%); }

        /* 列表容器 */
        .list-content { overflow-y: auto; flex: 1; padding: 14px 15px 80px 15px; }
        
        /* 單張定期卡片設計 (字體全面加大) */
        .deposit-item { 
            background: #f9f9fb; border: 1.5px solid #d1d1d6; border-radius: 16px; 
            padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
        }
        .deposit-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .bank-badge { background: #000000; color: #ffffff; font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: bold; display: inline-block; margin-bottom: 6px; }
        .deposit-dates { font-size: 13px; color: #3a3a3c; font-weight: bold; }
        .deposit-title { font-size: 15px; font-weight: bold; color: #1c1c1e; margin-top: 2px; }
        .deposit-duration { font-size: 12px; color: var(--hk-blue); font-weight: bold; margin-top: 4px; }
        
        .deposit-right { text-align: right; }
        .deposit-amt { font-size: 18px; font-weight: bold; color: #248a3d; font-variant-numeric: tabular-nums; }
        .deposit-interest { font-size: 13px; color: #3a3a3c; font-weight: bold; margin-top: 4px; }

        /* 進度條 (放大) */
        .progress-box { width: 100%; margin-top: 4px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: #3a3a3c; margin-bottom: 4px; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 10px; background: #e5e5ea; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--hk-blue); border-radius: 5px; transition: width 0.4s ease; }
        .progress-bar-fill.completed { background: var(--success); }

        .deposit-footer { display: flex; justify-content: flex-end; margin-top: 4px; }
        .delete-btn { background: none; border: none; color: #ff3b30; font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px; }

        /* 新增頁面樣式 */
        #addView { padding: 20px; overflow-y: auto; background: #ffffff; z-index: 20; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 18px; font-weight: bold; color: #1c1c1e; }
        .back-btn { background: none; border: none; font-size: 16px; color: var(--hk-blue); cursor: pointer; font-weight: bold; }

        .input-row { display: flex; flex-direction: column; gap: 14px; }
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .fields-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; }
        .field-unit { min-width: 0; width: 100%; }
        
        label { display: block; font-size: 12px; color: #3a3a3c; margin-bottom: 6px; font-weight: bold; white-space: nowrap; }
        
        input { 
            width: 100%; height: 46px; border: 1.5px solid #d1d1d6; border-radius: 12px; 
            font-size: 16px; background: #f9f9f9; text-align: center; margin: 0; padding: 0;
            -webkit-appearance: none; appearance: none; font-weight: bold;
        }

        .btn-submit { width: 100%; border: none; border-radius: 12px; font-weight: bold; color: white; font-size: 16px; height: 50px; cursor: pointer; background: var(--hk-blue); margin-top: 10px; }

        /* 浮動新增按鈕 (+) */
        .fab-btn {
            position: fixed; bottom: 30px; right: 20px; 
            width: 60px; height: 60px; background: var(--hk-blue); color: white; 
            border-radius: 50%; border: none; font-size: 32px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(0,122,255,0.4); cursor: pointer; z-index: 100;
            transition: transform 0.2s;
        }
        .fab-btn:active { transform: scale(0.92); }

        /* 底部控制列 */
        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); 
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); 
            display: flex; justify-content: center; border-top: 0.5px solid #e5e5ea;
            z-index: 10;
        }
        .btn-small-mng { background: none; border: 1.5px solid #ff3b30; color: #ff3b30; font-size: 12px; font-weight: bold; padding: 6px 14px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div style="font-size:10px; text-align:center; color:#8e8e93; margin-bottom:4px; font-weight:bold;">● 定期存款記錄器 (長者友善版)</div>

        <!-- 總覽卡片 -->
        <div class="display-card">
            <div class="card-title">進行中定期總本金</div>
            <span class="amount" id="totalPrincipal">HK$ 0.00</span>
            <div class="breakdown" id="totalInterestDisplay">預估總利息: HK$ 0.00</div>
        </div>

        <!-- 子分頁按鈕：進行中 / 已完結 -->
        <div class="tabs-header">
            <button class="tab-btn active" id="btnActive" onclick="switchTab('active')">⏳ 進行中</button>
            <button class="tab-btn" id="btnFinished" onclick="switchTab('finished')">🎉 已完結</button>
        </div>
    </div>

    <!-- 頁面容器 -->
    <div class="view-container">
        
        <!-- 主頁：顯示所有定期資料 (分頁) -->
        <div class="view" id="homeView">
            
            <!-- 進行中列表 -->
            <div class="list-content" id="activeListContainer">
                <div id="activeList"></div>
            </div>

            <!-- 已完結列表 (預設隱藏) -->
            <div class="list-content hidden" id="finishedListContainer" style="display: none;">
                <div id="finishedList"></div>
            </div>

            <div class="bottom-bar">
                <button class="btn-small-mng" onclick="handleReset()">🧹 清空所有定期紀錄</button>
            </div>
            
            <!-- 浮動新增按鈕 (+) -->
            <button class="fab-btn" onclick="switchView('add')">+</button>
        </div>

        <!-- 獨立新增頁面 -->
        <div class="view hidden-right" id="addView">
            <div class="page-header">
                <button class="back-btn" onclick="switchView('home')">‹ 返回主頁</button>
                <span class="page-title">新增定期存款</span>
                <div style="width: 50px;"></div>
            </div>
            
            <div class="input-row">
                <div class="fields-grid-3">
                    <div class="field-unit"><label>🏦 銀行</label><input type="text" id="depBank" placeholder="匯豐"></div>
                    <div class="field-unit"><label>💰 本金</label><input type="number" id="depAmt" placeholder="0.00" inputmode="decimal"></div>
                    <div class="field-unit"><label>📈 年利率 %</label><input type="number" id="depRate" placeholder="0.00" inputmode="decimal"></div>
                </div>
                <div class="fields-grid">
                    <div class="field-unit"><label>📅 起息日</label><input type="date" id="startDate"></div>
                    <div class="field-unit"><label>📅 到期日</label><input type="date" id="endDate"></div>
                </div>
                <button class="btn-submit" onclick="addDeposit()">確認新增並儲存</button>
            </div>
        </div>

    </div>

<script>
    let deposits = JSON.parse(localStorage.getItem('time_deposits')) || [];
    let currentTab = 'active'; // 'active' 或 'finished'

    const getTodayStr = () => new Date().toLocaleDateString('sv-SE');
    const getFutureStr = () => {
        let d = new Date();
        d.setFullYear(d.getFullYear() + 1);
        return d.toLocaleDateString('sv-SE');
    };
    
    document.getElementById('startDate').value = getTodayStr();
    document.getElementById('endDate').value = getFutureStr();

    function fmt(num) { return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function switchView(target) {
        const homeView = document.getElementById('homeView');
        const addView = document.getElementById('addView');

        if (target === 'add') {
            homeView.classList.add('hidden-left');
            addView.classList.remove('hidden-right');
        } else {
            addView.classList.add('hidden-right');
            homeView.classList.remove('hidden-left');
        }
    }

    // 切換「進行中」與「已完結」分頁
    function switchTab(tab) {
        currentTab = tab;
        const btnActive = document.getElementById('btnActive');
        const btnFinished = document.getElementById('btnFinished');
        const activeContainer = document.getElementById('activeListContainer');
        const finishedContainer = document.getElementById('finishedListContainer');

        if (tab === 'active') {
            btnActive.classList.add('active');
            btnFinished.classList.remove('active');
            activeContainer.style.display = 'block';
            finishedContainer.style.display = 'none';
        } else {
            btnFinished.classList.add('active');
            btnActive.classList.remove('active');
            activeContainer.style.display = 'none';
            finishedContainer.style.display = 'block';
        }
    }

    function saveAndRender() {
        localStorage.setItem('time_deposits', JSON.stringify(deposits));
        renderDeposits();
    }

    function addDeposit() {
        let bank = document.getElementById('depBank').value.trim() || "預設銀行";
        let amt = parseFloat(document.getElementById('depAmt').value);
        let rate = parseFloat(document.getElementById('depRate').value);
        let start = document.getElementById('startDate').value;
        let end = document.getElementById('endDate').value;

        if (!amt || !rate || !start || !end) {
            return alert("請完整填寫銀行、本金、利率及起訖日期！");
        }
        if (new Date(start) >= new Date(end)) {
            return alert("到期日必須大於起息日！");
        }

        deposits.push({ id: Date.now(), bank, amt, rate, start, end });
        
        document.getElementById('depBank').value = '';
        document.getElementById('depAmt').value = '';
        document.getElementById('depRate').value = '';
        
        switchView('home');
        switchTab('active');
        saveAndRender();
    }

    function deleteDeposit(id) {
        if (confirm("確定刪除這筆定期紀錄？")) {
            deposits = deposits.filter(x => x.id !== id);
            saveAndRender();
        }
    }

    function handleReset() {
        if (confirm("確定清空所有定期存款紀錄？")) {
            deposits = [];
            saveAndRender();
        }
    }

    function renderDeposits() {
        let totalPrin = 0;
        let totalInt = 0;
        let activeHtml = "";
        let finishedHtml = "";
        const now = new Date();
        now.setHours(0,0,0,0);

        deposits.forEach(item => {
            let sDate = new Date(item.start);
            let eDate = new Date(item.end);
            sDate.setHours(0,0,0,0);
            eDate.setHours(0,0,0,0);
            
            let totalDays = Math.max(1, Math.ceil(Math.abs(eDate - sDate) / (1000 * 60 * 60 * 24)));
            let diffMonths = (eDate.getFullYear() - sDate.getFullYear()) * 12 + (eDate.getMonth() - sDate.getMonth());
            let totalMonths = Math.max(1, (diffMonths + (eDate.getDate() - sDate.getDate()) / 30)).toFixed(1);

            let interest = (item.amt * (item.rate / 100) * totalDays) / 365;

            let passedDays = Math.ceil((now - sDate) / (1000 * 60 * 60 * 24));
            let pct = 0;
            if (passedDays <= 0) pct = 0;
            else if (now >= eDate) pct = 100;
            else pct = Math.min(100, Math.max(0, Math.round((passedDays / totalDays) * 100)));

            const isDone = pct >= 100;
            const bankName = item.bank || "預設銀行";

            let cardHtml = `
                <div class="deposit-item">
                    <div class="deposit-header">
                        <div>
                            <span class="bank-badge">🏦 ${bankName}</span>
                            <div class="deposit-dates">${item.start} ~ ${item.end}</div>
                            <div class="deposit-title">年利率: ${item.rate}%</div>
                            <div class="deposit-duration">⏱️ 共 ${totalDays} 天 (約 ${totalMonths} 個月)</div>
                        </div>
                        <div class="deposit-right">
                            <div class="deposit-amt">HK$ ${fmt(item.amt)}</div>
                            <div class="deposit-interest">預估利息: +${fmt(interest)}</div>
                        </div>
                    </div>

                    <div class="progress-box">
                        <div class="progress-info">
                            <span>${isDone ? '🎉 已到期' : '⏳ 存款進度'}</span>
                            <span>${pct}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${isDone ? 'completed' : ''}" style="width: ${pct}%;"></div>
                        </div>
                    </div>

                    <div class="deposit-footer">
                        <button class="delete-btn" onclick="deleteDeposit(${item.id})">刪除紀錄</button>
                    </div>
                </div>
            `;

            if (isDone) {
                finishedHtml += cardHtml;
            } else {
                activeHtml += cardHtml;
                totalPrin += item.amt;
                totalInt += interest;
            }
        });

        // 頂部總覽只計算「進行中」的總本金與利息
        document.getElementById('totalPrincipal').innerText = `HK$ ${fmt(totalPrin)}`;
        document.getElementById('totalInterestDisplay').innerText = `預估總利息: HK$ ${fmt(totalInt)}`;
        
        document.getElementById('activeList').innerHTML = activeHtml || '<div style="padding:40px; text-align:center; color:#8e8e93; font-size:14px; font-weight:bold;">沒有進行中的定期存款</div>';
        document.getElementById('finishedList').innerHTML = finishedHtml || '<div style="padding:40px; text-align:center; color:#8e8e93; font-size:14px; font-weight:bold;">沒有已完結的定期存款</div>';
    }

    renderDeposits();
</script>
</body>
</html>
